name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: >-
        postgresql://postgres:postgres@127.0.0.1:5432/my_todo_test?sslmode=disable

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: my_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d my_todo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'

      - name: Clean up lock files
        run: rm -f package-lock.json

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run database migration tests
        run: yarn test:db

      - name: Run Linter
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Security audit
        run: yarn audit

      - name: yarn tests coverage
        run: yarn test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
